<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment API Monitor</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-get: #4ade80;
            --accent-post: #f59e0b;
            --accent-res: #4ade80;
            --accent-error: #f43f5e;
            --border: #334155;
            --blue-sky: #38bdf8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            min-height: 100vh;
        }

        /* --- Loading Overlay --- */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.8);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(56, 189, 248, 0.1);
            border-left-color: var(--blue-sky);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* --- Header Layout (Desktop First) --- */
        header {
            padding: 1rem 2rem;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            gap: 15px;
        }

        h1 {
            margin: 0;
            font-size: 1.4rem;
            color: var(--blue-sky);
            white-space: nowrap;
            display: flex;
            align-items: center;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: nowrap;
        }

        .search-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .search-group {
            display: flex;
            gap: 5px;
        }

        .action-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        /* --- Components --- */
        .status-dot {
            height: 12px;
            width: 12px;
            background-color: #4ade80;
            border-radius: 50%;
            display: inline-block;
            margin-right: 10px;
            box-shadow: 0 0 8px #4ade80;
        }

        .status-dot.offline {
            background-color: #f43f5e;
            box-shadow: 0 0 8px #f43f5e;
        }

        .btn-clear {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 0.5rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .btn-clear:hover {
            background: #334155;
            color: white;
        }

        .btn-apply {
            background: var(--blue-sky);
            color: #0f172a;
            font-weight: bold;
            border: none;
        }

        .btn-delete {
            border-color: var(--accent-error);
            color: var(--accent-error);
        }

        .btn-delete:hover {
            background: rgba(244, 63, 94, 0.1);
        }

        select.btn-clear {
            background-color: #0f172a;
        }

        #exact-time-filter {
            width: 200px;
            background: rgba(0, 0, 0, 0.2);
        }

        /* --- Logs Content --- */
        #logs-container {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .transaction-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            animation: slideIn 0.3s ease-out;
            border-left: 4px solid var(--accent-post);
        }

        .card-header {
            padding: 0.75rem 1.25rem;
            background-color: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .method-badge {
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #000;
        }

        .method-get {
            background-color: var(--accent-get);
        }

        .method-post {
            background-color: var(--accent-post);
        }

        .source-badge {
            font-size: 0.7rem;
            background: var(--blue-sky);
            color: #000;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 8px;
            font-weight: bold;
        }

        .url-text {
            font-family: monospace;
            font-size: 0.9rem;
            word-break: break-all;
        }

        .time-text {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .card-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1px;
            background-color: var(--border);
        }

        .log-section {
            padding: 1.25rem;
            background-color: var(--card-bg);
        }

        .section-title {
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 0.75rem;
        }

        pre {
            background-color: rgba(0, 0, 0, 0.3);
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.8rem;
            white-space: pre-wrap;
            word-break: break-all;
            margin: 0;
            color: #e2e8f0;
            max-height: 350px;
            overflow-y: auto;
        }

        /* --- RESPONSIVE MOBILE (ตามรูปที่ 1) --- */
        @media (max-width: 1024px) {
            header {
                flex-direction: column;
                align-items: flex-start;
                padding: 1.5rem;
            }

            .header-controls {
                flex-direction: column;
                align-items: stretch;
                width: 100%;
                gap: 15px;
            }

            .search-group {
                width: 100%;
            }

            #exact-time-filter {
                width: 100%;
            }

            .action-group {
                flex-wrap: wrap;
            }

            .action-group>* {
                flex: 1;
                text-align: center;
            }

            .card-body {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <div id="loading-text" style="font-size: 0.9rem; color: var(--blue-sky);">Filtering...</div>
    </div>

    <header>
        <h1><span id="conn-status" class="status-dot offline"></span> Payment API Monitor</h1>

        <div class="header-controls">
            <div class="search-container">
                <div class="search-group">
                    <input type="text" id="exact-time-filter" class="btn-clear" placeholder="ค้นหาที่นี่...">
                    <button class="btn-clear btn-apply" onclick="applyExactTimeFilter()">Apply</button>
                </div>
                <small style="color: var(--text-secondary); font-size: 0.65rem;">
                    ** Keyword หรือ ช่วงเวลา 16:00 - 16:15 หรือ 16:00 **
                </small>
            </div>

            <div class="action-group">
                <select id="time-filter" class="btn-clear" onchange="applyTimeFilter()">
                    <option value="0">All Time</option>
                    <option value="1">Last 1 Minute</option>
                    <option value="5">Last 5 Minutes</option>
                    <option value="30" selected>Last 30 Minutes</option>
                </select>
                <button class="btn-clear" onclick="clearLogs()">Clear Logs</button>
                <button class="btn-clear btn-delete" onclick="deleteServerLogs()">Delete All (Server)</button>
            </div>
        </div>
    </header>

    <div id="logs-container"></div>

    <script>
        const container = document.getElementById('logs-container');
        const statusDot = document.getElementById('conn-status');
        const loadingOverlay = document.getElementById('loading-overlay');
        const cards = {};

        let lastClearTime = 0;
        let filterEndTime = Infinity;
        let searchKeyword = "";

        function getFriendlyName(url) {
            if (!url) return 'API';
            const lowerUrl = url.toLowerCase();
            if (lowerUrl.includes('/gettoken')) return 'GET-token';
            if (lowerUrl.includes('/inquiryqrpayment')) return 'Inquiry';
            if (lowerUrl.includes('/checkpaymenttransaction')) return 'Check-payment';
            if (lowerUrl.includes('/payment')) return 'Payment';
            return 'Unknown';
        }

        async function fetchLogs() {
            try {
                const response = await fetch('/logs');
                if (!response.ok) throw new Error('Network error');
                const logs = await response.json();
                statusDot.classList.remove('offline');

                logs.forEach(log => {
                    if (log.type === 'request') {
                        createCard(log);
                    } else {
                        updateCard(log);
                    }
                });
            } catch (error) {
                statusDot.classList.add('offline');
            }
        }

        setInterval(fetchLogs, 2000);

        function applyTimeFilter() {
            const filterMinutes = parseInt(document.getElementById('time-filter').value);
            loadingOverlay.style.display = 'flex';
            container.innerHTML = '';
            for (const key in cards) delete cards[key];

            if (filterMinutes === 0) lastClearTime = 0;
            else lastClearTime = Date.now() - (filterMinutes * 60 * 1000);

            setTimeout(() => { loadingOverlay.style.display = 'none'; }, 500);
        }

        function applyExactTimeFilter() {
            const input = document.getElementById('exact-time-filter').value.trim();
            loadingOverlay.style.display = 'flex';
            container.innerHTML = '';
            for (const key in cards) delete cards[key];

            if (!input) {
                searchKeyword = ""; lastClearTime = 0; filterEndTime = Infinity;
            } else if (input.includes('-')) {
                const parts = input.split('-').map(p => p.trim());
                try {
                    const now = new Date();
                    const s = parts[0].split(':');
                    const e = parts[1].split(':');
                    lastClearTime = new Date(now.getFullYear(), now.getMonth(), now.getDate(), parseInt(s[0]), parseInt(s[1])).getTime();
                    filterEndTime = new Date(now.getFullYear(), now.getMonth(), now.getDate(), parseInt(e[0]), parseInt(e[1])).getTime();
                } catch (e) { alert("Format Error"); }
            } else {
                searchKeyword = input.toLowerCase();
            }

            setTimeout(() => { loadingOverlay.style.display = 'none'; }, 500);
        }

        function createCard(data) {
            const logTime = new Date(data.time).getTime();

            // 1. แก้ไขการกรองเวลา: ถ้าเป็น All Time (0) ให้ผ่านตลอด
            if (lastClearTime !== 0 && logTime < lastClearTime) return;
            if (filterEndTime !== Infinity && logTime > filterEndTime) return;
            if (searchKeyword && !(data.url).toLowerCase().includes(searchKeyword)) return;
            if (document.getElementById(`card-${data.id}`)) return;

            const card = document.createElement('div');
            card.className = 'transaction-card';
            card.id = `card-${data.id}`;

            const method = (data.method || 'GET').toUpperCase();
            const methodClass = method === 'POST' ? 'method-post' : 'method-get';

            card.innerHTML = `
                <div class="card-header">
                    <div>
                        <span class="source-badge">${getFriendlyName(data.url)}</span>
                        <span class="method-badge ${methodClass}">${method}</span>
                        <span class="url-text">${data.url || ''}</span>
                    </div>
                    <div class="time-text">${new Date(logTime).toLocaleTimeString()}</div>
                </div>
                <div class="card-body">
                    <div class="log-section">
                        <div class="section-title" style="color: var(--blue-sky)">📦 Request</div>
                        <pre>${JSON.stringify({ headers: data.headers, body: data.body }, null, 2)}</pre>
                    </div>
                    <div class="log-section" id="res-section-${data.id}">
                        <div class="section-title" style="color: var(--accent-res)">📥 Response</div>
                        <pre>Waiting for response...</pre>
                    </div>
                </div>
            `;
            container.prepend(card);
            cards[data.id] = card;
        }

        function updateCard(data) {
            const resSection = document.getElementById(`res-section-${data.id}`);
            if (!resSection) return;
            resSection.innerHTML = `
                <div class="section-title" style="color: var(--accent-res)">📥 Response [${data.statusCode || 200}] ${data.Error} </div>
                <pre>${JSON.stringify(data.response, null, 2)}</pre>
            `;
        }

        function clearLogs() {
            lastClearTime = Date.now();
            filterEndTime = Infinity;
            searchKeyword = "";
            document.getElementById('exact-time-filter').value = "";
            document.getElementById('time-filter').value = "0";
            container.innerHTML = '';
            for (const key in cards) delete cards[key];
        }

        async function deleteServerLogs() {
            if (!confirm("คุณต้องการลบ Log ทั้งหมดออกจาก Server ใช่หรือไม่? (ไม่สามารถย้อนคืนได้)")) {
                return;
            }

            try {
                loadingOverlay.style.display = 'flex';
                // สมมติว่าสร้าง Endpoint ไว้ที่ /logs/delete
                const response = await fetch('/logs/delete', { method: 'DELETE' });

                if (response.ok) {
                    // เมื่อลบที่ Server สำเร็จ ก็ล้างหน้าจอ Frontend ด้วย
                    clearLogs();
                    alert("ลบข้อมูลสำเร็จ");
                } else {
                    alert("เกิดข้อผิดพลาดในการลบข้อมูลที่ Server");
                }
            } catch (error) {
                console.error("Error deleting logs:", error);
                alert("ไม่สามารถติดต่อ Server ได้");
            } finally {
                loadingOverlay.style.display = 'none';
            }
        }

    </script>
</body>

</html>
