<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment API Monitor</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-get: #4ade80;
            --accent-post: #f59e0b;
            --accent-res: #4ade80;
            --accent-error: #f43f5e;
            --border: #334155;
            --blue-sky: #38bdf8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            min-height: 100vh;
        }

        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.8);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(56, 189, 248, 0.1);
            border-left-color: var(--blue-sky);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        header {
            padding: 1rem 2rem;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 { margin: 0; font-size: 1.5rem; color: var(--blue-sky); }

        .status-dot {
            height: 10px; width: 10px;
            background-color: #4ade80;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }
        .status-dot.offline { background-color: #f43f5e; }

        #logs-container {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .transaction-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            animation: slideIn 0.3s ease-out;
            border-left: 4px solid #f59e0b;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-header {
            padding: 0.75rem 1.25rem;
            background-color: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .method-badge {
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #000;
        }
        .method-get { background-color: var(--accent-get); }
        .method-post { background-color: var(--accent-post); }

        .source-badge {
            font-size: 0.7rem;
            background: var(--blue-sky);
            color: #000;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 8px;
            font-weight: bold;
        }

        .url-text { font-family: monospace; font-size: 0.95rem; word-break: break-all; }
        .time-text { font-size: 0.8rem; color: var(--text-secondary); min-width: 80px; text-align: right; }

        .card-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1px;
            background-color: var(--border);
        }

        .log-section { padding: 1.25rem; background-color: var(--card-bg); }
        .section-title { font-size: 0.75rem; font-weight: bold; text-transform: uppercase; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 6px; }
        .title-req { color: var(--blue-sky); }
        .title-res { color: var(--accent-res); }

        pre {
            background-color: rgba(0, 0, 0, 0.3);
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.85rem;
            white-space: pre-wrap;
            word-break: break-all;
            margin: 0;
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.05);
            max-height: 400px;
            overflow-y: auto;
        }

        .status-badge { font-size: 0.75rem; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
        .status-200 { background-color: rgba(74, 222, 128, 0.2); color: #4ade80; }
        .status-error { background-color: rgba(244, 63, 94, 0.2); color: #f43f5e; }
        .status-processing { background-color: rgba(56, 189, 248, 0.2); color: var(--blue-sky); }

        .btn-clear {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-clear:hover { background: #334155; color: white; }

        @media (max-width: 768px) { .card-body { grid-template-columns: 1fr; } }
    </style>
</head>

<body>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <div id="loading-text" style="font-size: 0.9rem; color: var(--blue-sky);">Filtering Logs...</div>
    </div>

    <header>
        <div>
            <h1><span id="conn-status" class="status-dot offline"></span> Payment API Monitor</h1>
        </div>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="exact-time-filter" class="btn-clear" 
                   placeholder="Time (16:14) or Keyword (token)" style="width: 200px;">
            <button class="btn-clear" onclick="applyExactTimeFilter()" 
                    style="background: var(--blue-sky); color: #000; font-weight: bold;">Apply</button>
            <button class="btn-clear" onclick="clearLogs()">Clear Logs</button>
        </div>
    </header>

    <div id="logs-container"></div>

    <script>
        const container = document.getElementById('logs-container');
        const statusDot = document.getElementById('conn-status');
        const loadingOverlay = document.getElementById('loading-overlay');
        const cards = {};

        // Filter States
        let lastClearTime = 0;
        let filterEndTime = Infinity;
        let searchKeyword = "";

        function getFriendlyName(url) {
            if (!url) return 'API';
            const lowerUrl = url.toLowerCase();
            if (lowerUrl.includes('/gettoken')) return 'GET-token';
            if (lowerUrl.includes('/inquiryqrpayment')) return 'Inquiry';
            if (lowerUrl.includes('/checkpaymenttransaction')) return 'Check-payment';
            if (lowerUrl.includes('/payment')) return 'Payment';
            return 'Unknown';
        }

        async function fetchLogs() {
            try {
                const response = await fetch('/logs');
                if (!response.ok) throw new Error('Network error');
                const logs = await response.json();
                statusDot.classList.remove('offline');

                logs.forEach(log => {
                    if (log.type === 'request') {
                        createCard(log);
                    } else {
                        updateCard(log);
                    }
                });
            } catch (error) {
                statusDot.classList.add('offline');
            }
        }

        setInterval(fetchLogs, 2000);

        function applyExactTimeFilter() {
            const input = document.getElementById('exact-time-filter').value.trim();
            loadingOverlay.style.display = 'flex';

            if (!input) {
                searchKeyword = "";
                lastClearTime = 0;
                filterEndTime = Infinity;
            } else {
                const isTimeFormat = /^(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?$/.test(input);

                if (isTimeFormat) {
                    searchKeyword = "";
                    try {
                        const now = new Date();
                        const parts = input.split(':');
                        const hours = parseInt(parts[0]);
                        const minutes = parseInt(parts[1]);
                        const seconds = parts[2] ? parseInt(parts[2]) : null;

                        const startDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hours, minutes, seconds || 0);
                        
                        if (seconds === null) {
                            let endDate = new Date(startDate);
                            endDate.setSeconds(59);
                            endDate.setMilliseconds(999);
                            filterEndTime = endDate.getTime();
                        } else {
                            filterEndTime = Infinity;
                        }
                        lastClearTime = startDate.getTime();
                    } catch (e) { console.error(e); }
                } else {
                    searchKeyword = input.toLowerCase();
                    lastClearTime = 0;
                    filterEndTime = Infinity;
                }
            }

            // Refresh UI
            container.innerHTML = '';
            for (const key in cards) delete cards[key];
            
            setTimeout(() => { loadingOverlay.style.display = 'none'; }, 500);
        }

        function createCard(data) {
            const logTime = data.time ? new Date(data.time).getTime() : Date.now();
            const url = (data.url || "").toLowerCase();

            // Check Filter Conditions
            if (logTime < lastClearTime || logTime > filterEndTime) return;
            if (searchKeyword && !url.includes(searchKeyword)) return;

            if (document.getElementById(`card-${data.id}`)) return;

            const card = document.createElement('div');
            card.className = 'transaction-card';
            card.id = `card-${data.id}`;

            const timeStr = new Date(logTime).toLocaleTimeString();
            const method = (data.method || 'GET').toUpperCase();
            const methodClass = method === 'POST' ? 'method-post' : 'method-get';
            const friendlyName = getFriendlyName(data.url);

            const hasResponse = data.response || data.statusCode;
            const responseContent = hasResponse ? JSON.stringify(data.response, null, 2) : 'Waiting for response...';
            const statusBadge = hasResponse
                ? `<span class="status-badge ${data.statusCode >= 400 ? 'status-error' : 'status-200'}">${data.statusCode}</span>`
                : `<span class="status-badge status-processing">Processing...</span>`;

            card.innerHTML = `
                <div class="card-header">
                    <div>
                        <span class="source-badge">${friendlyName}</span>
                        <span class="method-badge ${methodClass}">${method}</span>
                        <span class="url-text">${data.url || ''}</span>
                    </div>
                    <div class="time-text">${timeStr}</div>
                </div>
                <div class="card-body">
                    <div class="log-section">
                        <div class="section-title title-req">📦 Request Body / Headers</div>
                        <pre>${JSON.stringify({ headers: data.headers, body: data.body }, null, 2)}</pre>
                    </div>
                    <div class="log-section" id="res-section-${data.id}">
                        <div class="section-title title-res">📥 Response ${statusBadge}</div>
                        <pre>${responseContent}</pre>
                    </div>
                </div>
            `;

            container.prepend(card);
            cards[data.id] = card;
        }

        function updateCard(data) {
            const logTime = data.time ? new Date(data.time).getTime() : Date.now();
            const url = (data.url || "").toLowerCase();

            if (logTime < lastClearTime || logTime > filterEndTime) return;
            if (searchKeyword && !url.includes(searchKeyword)) return;

            if (!document.getElementById(`card-${data.id}`)) {
                createCard(data);
                return;
            }

            const resSection = document.getElementById(`res-section-${data.id}`);
            if (!resSection) return;

            const statusCode = data.statusCode || '200';
            const isError = data.type === 'error' || statusCode >= 400;
            const statusClass = isError ? 'status-error' : 'status-200';
            const duration = data.duration ? `⏱ ${data.duration}ms` : '';

            resSection.innerHTML = `
                <div class="section-title title-res">
                    📥 Response 
                    <span class="status-badge ${statusClass}">${statusCode}</span>
                    <span style="font-size: 0.75rem; color: #94a3b8; margin-left:10px;">${duration}</span>
                </div>
                <pre>${JSON.stringify(data.response || { message: data.message }, null, 2)}</pre>
            `;
        }

        function clearLogs() {
            lastClearTime = Date.now();
            filterEndTime = Infinity;
            searchKeyword = "";
            document.getElementById('exact-time-filter').value = "";
            container.innerHTML = '';
            for (const key in cards) delete cards[key];
        }
    </script>
</body>
</html>
